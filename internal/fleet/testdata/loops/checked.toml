# Acceptance fixture (scenario 5): a step whose done also needs a
# command that always fails. COUNT_FILE counts the runs.
name = "checked"

[[steps]]
name = "a"
kind = "agent"
role = "alpha"
session = "a"
output = "a/round-{round}.json"
shape = "json"
required = ["result"]

[[steps.done]]
kind = "command"
run = "echo run >> \"$COUNT_FILE\"; echo boom; exit 1"
timeout = "30s"
